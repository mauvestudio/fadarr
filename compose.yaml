# fadarr — Docker Compose.
# Set the paths in a .env file next to this file (see .env.example), or edit the defaults below.
# Unraid (Compose Manager plugin): Docker > Add New Stack "fadarr" > Edit Stack > Compose File (and the .env tab).
services:
  fadarr:
    build: ${FADARR_APP:-.}                       # folder containing this code
    image: fadarr:local
    container_name: fadarr
    restart: unless-stopped
    user: "${FADARR_UID:-99}:${FADARR_GID:-100}"  # 99:100 = nobody:users on Unraid
    ports:
      - "${FADARR_PORT:-3010}:3010"
    environment:
      - TZ=${TZ:-Europe/Paris}
      - AUTH_USER=${AUTH_USER:-}                  # optional password (recommended if reachable from outside your home)
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      - ${FADARR_DATA:-./data}:/app/data                       # fadarr database (cues, playlists, settings)
      - ${FADARR_MUSIC:-/path/to/music}:/music:ro,slave        # your music, READ-ONLY: fadarr never modifies audio files
